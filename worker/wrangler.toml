name = "ulpan-morph"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Les bindings ratelimit de Cloudflare ont ete RETIRES d'ici le 2026-08-26, apres mesure : avec
# une limite declaree a 5 requetes / 60s, douze appels passaient tous en 200. Un /diag temporaire
# confirmait pourtant env.RL, RL_DEV, RL_AI et RL_AI_DEV presents et limit() bien une fonction :
# l'appel repondait "autorise" malgre le depassement. wrangler 4.33.1 transmet
# [[unsafe.bindings]] en "Unsafe Metadata" sans le valider, et la cle moderne [[ratelimits]] est
# ignoree en silence (les bindings disparaissent du deploiement). Un limiteur qui ne refuse jamais
# est pire qu'aucun : il fait croire a une protection.
#
# Le comptage se fait donc dans src/index.js (fenetre glissante en memoire d'isolate, voir la
# fonction allow). Best-effort et par colo - exactement ce que le limiteur natif se declare lui
# meme - mais il refuse vraiment. Echelon superieur, le jour ou le trafic le justifie : un Durable
# Object, fortement coherent.

# Le compteur du limiteur. Une instance par cle (appareil, puis IP), pinnee et mono-thread :
# le seul endroit de la plateforme ou un compteur partage existe reellement. Les deux approches
# precedentes ont ete mesurees et ne refusaient rien - voir la classe RateLimiter dans src/index.js.
[[durable_objects.bindings]]
name = "LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

# Anonymous usage analytics for /track (free tier). No cookies, no PII — the client sends
# a random anon id + event names; country/device are derived server-side from the request.
[[analytics_engine_datasets]]
binding = "AE"
dataset = "ulpan_events"

# Workers AI binding for the /nat "natural version" layer (Llama 3.3 70B). Free tier: a daily
# neuron allowance; /nat is on-demand + 7-day cached, so real personal use stays well under it.
[ai]
binding = "AI"
